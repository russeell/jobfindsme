name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-ubuntu:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libcurl4-openssl-dev fonts-noto-cjk
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - name: Synthetic evaluation regression gate
        run: >-
          python -m evaluation.cli
          --dataset evaluation/data/v0.1.json
          --report ${{ runner.temp }}/synthetic-evaluation.json
          --type synthetic
      - name: Golden matching regression gate
        run: >-
          python -m evaluation.cli
          --dataset evaluation/data/golden/golden_v1.json
          --report ${{ runner.temp }}/golden-evaluation.json
          --type golden
      - run: ruff check .
      - run: ruff format --check .
      - run: bash scripts/smoke_installed_package.sh

  test-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - run: ruff check .
      - run: ruff format --check .

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Windows runtime and browser path regressions
        run: >-
          python -m pytest
          tests/connectors/test_boss_zhipin.py
          tests/installer
          tests/mcp/test_stdio_server.py
          tests/integrations/test_cli_workflow.py
      - name: Build and install the Windows wheel
        shell: pwsh
        run: |
          python -m pip install build
          python -m build --wheel
          $wheel = Get-ChildItem dist -Filter *.whl | Select-Object -First 1
          python -m pip install --force-reinstall --no-deps $wheel.FullName
          agent-job-search --version
      - run: ruff check .
      - run: ruff format --check .

  clean-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: bash scripts/smoke_fast_install.sh

  agent-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Canonical Skill is synchronized into the wheel package
        run: python scripts/sync_skill.py --check
      - name: No-Skill baseline must fail
        run: >-
          python -m evaluation.agent_behavior.cli
          --cases evaluation/agent_behavior/data/cases.json
          --transcripts evaluation/agent_behavior/data/fixtures/baseline.json
          --report ${{ runner.temp }}/agent-baseline.json
          --expect fail
          --require-evidence contract_fixture
      - name: Skill contract must pass
        run: >-
          python -m evaluation.agent_behavior.cli
          --cases evaluation/agent_behavior/data/cases.json
          --transcripts evaluation/agent_behavior/data/fixtures/with_skill.json
          --report ${{ runner.temp }}/agent-with-skill.json
          --expect pass
          --require-evidence contract_fixture
