<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" font-family="'SF Mono','Menlo','Consolas','PingFang SC','Microsoft YaHei',monospace">
  <defs>
    <style>
      .panel   { opacity: 0; animation: fadeUp .55s ease-out forwards; }
      .bosscol { animation-delay: 1.5s; }
      .lpcol   { animation-delay: 1.85s; }
      .row     { opacity: 0; animation: fadeUp .45s ease-out forwards; }
      .r1 { animation-delay: 2.05s; } .r2 { animation-delay: 2.25s; } .r3 { animation-delay: 2.45s; }
      .r4 { animation-delay: 2.35s; } .r5 { animation-delay: 2.55s; } .r6 { animation-delay: 2.75s; }
      .badge   { animation: pulse 1.6s ease-in-out infinite; }
      .type    { animation: typing 1.4s steps(28) 0.3s forwards; }
      .caret   { animation: blink 1s step-end 1.7s infinite; }
      @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes typing { from { width: 0; } to { width: 360px; } }
      @keyframes blink  { 0%,100% { opacity: 1; } 50% { opacity: 0; } }
      @keyframes pulse  { 0%,100% { opacity: 1; } 50% { opacity: .45; } }
      .txt  { fill: #e6edf3; }
      .mut  { fill: #8b949e; }
      .wht  { fill: #ffffff; font-weight: 700; }
    </style>
    <clipPath id="typeClip"><rect x="46" y="62" width="0" height="26" class="type"/></clipPath>
  </defs>

  <!-- backdrop -->
  <rect x="0" y="0" width="780" height="470" rx="14" fill="#0d1117"/>
  <rect x="0" y="0" width="780" height="44" rx="14" fill="#161b22"/>
  <rect x="0" y="22" width="780" height="22" fill="#161b22"/>
  <circle cx="24" cy="22" r="6" fill="#ff5f56"/><circle cx="42" cy="22" r="6" fill="#ffbd2e"/><circle cx="60" cy="22" r="6" fill="#27c93f"/>
  <text x="84" y="27" class="mut" font-size="13">jobfindsme · 一句话双平台搜索</text>

  <!-- input line -->
  <text x="24" y="80" fill="#3fb950" font-size="15">›</text>
  <g clip-path="url(#typeClip)">
    <text x="46" y="80" class="txt" font-size="15">找 上海 · Python · 数据分析 岗位</text>
  </g>
  <rect x="320" y="64" width="8" height="16" fill="#3fb950" class="caret"/>

  <line x1="20" y1="96" x2="760" y2="96" stroke="#21262d"/>

  <!-- ===== BOSS直聘 column ===== -->
  <g class="panel bosscol">
    <rect x="20" y="106" width="362" height="346" rx="10" fill="#161b22" stroke="#30363d"/>
    <rect x="20" y="106" width="362" height="38" rx="10" fill="#FF6A00" opacity="0.16"/>
    <rect x="20" y="128" width="362" height="16" fill="#FF6A00" opacity="0.16"/>
    <circle cx="44" cy="125" r="8" fill="#FF6A00"/>
    <text x="60" y="130" fill="#FF6A00" font-size="15" font-weight="700">BOSS直聘</text>
    <text x="356" y="130" class="mut" font-size="11" text-anchor="end">实时返回</text>

    <!-- job row 1 -->
    <g class="row r1">
      <rect x="32" y="156" width="338" height="80" rx="8" fill="#0d1117" stroke="#30363d"/>
      <text x="46" y="182" class="wht" font-size="13">数据分析师</text>
      <text x="46" y="204" class="mut" font-size="11">某科技公司 · 18-30K·14薪</text>
      <rect x="282" y="170" width="78" height="22" rx="11" fill="#238636" class="badge"/>
      <text x="321" y="185" fill="#fff" font-size="11" text-anchor="middle">匹配 94%</text>
      <text x="46" y="226" fill="#58a6ff" font-size="11">投递 ↗ boss.zhipin.com/j/8821</text>
    </g>
    <!-- job row 2 -->
    <g class="row r2">
      <rect x="32" y="246" width="338" height="80" rx="8" fill="#0d1117" stroke="#30363d"/>
      <text x="46" y="272" class="wht" font-size="13">Python 数据开发</text>
      <text x="46" y="294" class="mut" font-size="11">智云网络 · 20-35K</text>
      <rect x="282" y="260" width="78" height="22" rx="11" fill="#238636" class="badge"/>
      <text x="321" y="275" fill="#fff" font-size="11" text-anchor="middle">匹配 91%</text>
      <text x="46" y="316" fill="#58a6ff" font-size="11">投递 ↗ boss.zhipin.com/j/7730</text>
    </g>
    <!-- job row 3 -->
    <g class="row r3">
      <rect x="32" y="336" width="338" height="80" rx="8" fill="#0d1117" stroke="#30363d"/>
      <text x="46" y="362" class="wht" font-size="13">商业分析 BA</text>
      <text x="46" y="384" class="mut" font-size="11">星河数据 · 15-25K</text>
      <rect x="282" y="350" width="78" height="22" rx="11" fill="#238636" class="badge"/>
      <text x="321" y="365" fill="#fff" font-size="11" text-anchor="middle">匹配 88%</text>
      <text x="46" y="406" fill="#58a6ff" font-size="11">投递 ↗ boss.zhipin.com/j/6612</text>
    </g>
  </g>

  <!-- ===== 猎聘 column ===== -->
  <g class="panel lpcol">
    <rect x="398" y="106" width="362" height="346" rx="10" fill="#161b22" stroke="#30363d"/>
    <rect x="398" y="106" width="362" height="38" rx="10" fill="#00B38A" opacity="0.16"/>
    <rect x="398" y="128" width="362" height="16" fill="#00B38A" opacity="0.16"/>
    <circle cx="422" cy="125" r="8" fill="#00B38A"/>
    <text x="438" y="130" fill="#00B38A" font-size="15" font-weight="700">猎聘</text>
    <text x="734" y="130" class="mut" font-size="11" text-anchor="end">实时返回</text>

    <!-- job row 1 -->
    <g class="row r4">
      <rect x="410" y="156" width="338" height="80" rx="8" fill="#0d1117" stroke="#30363d"/>
      <text x="424" y="182" class="wht" font-size="13">高级数据分析专家</text>
      <text x="424" y="204" class="mut" font-size="11">寰宇科技 · 25-40K·15薪</text>
      <rect x="660" y="170" width="78" height="22" rx="11" fill="#238636" class="badge"/>
      <text x="699" y="185" fill="#fff" font-size="11" text-anchor="middle">匹配 93%</text>
      <text x="424" y="226" fill="#58a6ff" font-size="11">投递 ↗ liepin.com/job/5521</text>
    </g>
    <!-- job row 2 -->
    <g class="row r5">
      <rect x="410" y="246" width="338" height="80" rx="8" fill="#0d1117" stroke="#30363d"/>
      <text x="424" y="272" class="wht" font-size="13">数据产品经理</text>
      <text x="424" y="294" class="mut" font-size="11">云图信息 · 22-38K</text>
      <rect x="660" y="260" width="78" height="22" rx="11" fill="#238636" class="badge"/>
      <text x="699" y="275" fill="#fff" font-size="11" text-anchor="middle">匹配 90%</text>
      <text x="424" y="316" fill="#58a6ff" font-size="11">投递 ↗ liepin.com/job/4810</text>
    </g>
    <!-- job row 3 -->
    <g class="row r6">
      <rect x="410" y="336" width="338" height="80" rx="8" fill="#0d1117" stroke="#30363d"/>
      <text x="424" y="362" class="wht" font-size="13">BI 数据分析师</text>
      <text x="424" y="384" class="mut" font-size="11">明远咨询 · 18-30K</text>
      <rect x="660" y="350" width="78" height="22" rx="11" fill="#238636" class="badge"/>
      <text x="699" y="365" fill="#fff" font-size="11" text-anchor="middle">匹配 86%</text>
      <text x="424" y="406" fill="#58a6ff" font-size="11">投递 ↗ liepin.com/job/3993</text>
    </g>
  </g>
</svg>
