[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "jobfindsme"
version = "0.2.0rc5"
description = "🔥 让岗位来找你——一句话搜各大招聘网站，搜的全，匹配准，投的快！"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "certifi>=2024.8.30",
  "pydantic>=2.10,<3",
  "pypdf>=5,<7",
]

[project.optional-dependencies]
browser = [
  "playwright>=1.50,<2",
  "requests>=2.32,<3",
  "websocket-client>=1.8,<2",
]
dev = [
  "pytest>=8,<10",
  "ruff>=0.12,<1",
]

[project.scripts]
jobfindsme = "jobfindsme.cli:main"

[project.urls]
Homepage = "https://github.com/russeell/jobfindsme"
Repository = "https://github.com/russeell/jobfindsme"
Issues = "https://github.com/russeell/jobfindsme/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jobfindsme = [
  "migrations/*.sql",
  "resources/**/*.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
