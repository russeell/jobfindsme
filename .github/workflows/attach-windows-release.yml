name: Attach verified desktop release
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful macOS or Windows desktop package run ID
        required: true
      tag:
        description: Existing draft release tag
        required: true
permissions:
  actions: read
  contents: write
jobs:
  attach:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PACKAGE_RUN: ${{ inputs.run_id }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Validate, download and attach the tested package
        shell: python
        run: |
          import hashlib, json, os, pathlib, re, subprocess, zipfile
          def gh(*args):
              return subprocess.check_output(['gh', *args], text=True)
          tag, run = os.environ['RELEASE_TAG'], os.environ['PACKAGE_RUN']
          assert re.fullmatch(r'v\d+\.\d+\.\d+', tag)
          assert re.fullmatch(r'\d+', run)
          repo = os.environ['GH_REPO']
          build = json.loads(gh('api', f'repos/{repo}/actions/runs/{run}'))
          release = json.loads(gh('release', 'view', tag, '--json', 'isDraft,targetCommitish,assets'))
          assert release['isDraft'], 'Only an unpublished draft may be changed'
          assert build['conclusion'] == 'success' and build['name'] in {'Windows desktop package', 'macOS desktop package'}
          mac = build['name'] == 'macOS desktop package'
          asset = 'mac-arm64.zip' if mac else 'windows-x64.zip'
          artifact = 'JobFindsMe-mac-arm64' if mac else 'JobFindsMe-windows-x64'
          prefix = 'JobFindsMe.app/Contents/Resources/' if mac else 'JobFindsMe/resources/'
          assert build['head_sha'] == release['targetCommitish'], 'Package and release commits differ'
          folder = pathlib.Path(os.environ['RUNNER_TEMP']) / 'verified-release'
          gh('run', 'download', run, '--name', artifact, '--dir', str(folder))
          package = folder / asset
          if not package.exists() and not mac:
              package = folder / 'JobFindsMe-windows-x64.zip'  # Older verified runs.
          assert package.is_file(), 'Verified desktop ZIP is missing'
          with zipfile.ZipFile(package) as archive:
              assert archive.testzip() is None
              names = archive.namelist()
              for name in names:
                  assert not name.startswith('/') and '..' not in pathlib.PurePosixPath(name).parts
                  assert name.startswith(('JobFindsMe.app/', '__MACOSX/')) if mac else name.startswith('JobFindsMe/')
                  if mac and name.startswith('__MACOSX/'):
                      continue
                  assert not re.search(r'(^|/)(Cookies|Local Storage|Session Storage|\.env)(/|$)|\.(db|sqlite|sqlite3)(-wal|-shm|-journal)?$', name, re.I), name
                  if re.search(r'\.(pdf|docx)$', name, re.I):
                      assert name == prefix + 'python/jobfindsme-api/_internal/docx/templates/default.docx', name
              info = json.loads(archive.read(prefix + 'app/package.json'))
              assert info['version'] == tag[1:] and info['build'] == tag and info['releaseTag'] == tag
              assert info['sourceCommit'] == build['head_sha'], 'Embedded source commit differs'
              assert not info.get('qa') and not info.get('jobfindsmePreview')
          with package.open('rb') as stream:
              digest = hashlib.file_digest(stream, 'sha256').hexdigest()
          existing = next((item for item in release['assets'] if item['name'] == asset), None)
          if existing:
              assert existing['state'] == 'uploaded' and existing['digest'] == 'sha256:' + digest
          else:
              target = folder / asset
              if package != target:
                  package.rename(target)
              gh('release', 'upload', tag, str(target))
          print(asset + ' SHA256=' + digest)
          pathlib.Path(os.environ['GITHUB_STEP_SUMMARY']).write_text('Verified package from ' + build['head_sha'] + '\n\n' + asset + ' SHA256=' + digest + '\n')
