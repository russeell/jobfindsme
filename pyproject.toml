[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "jobfindsme"
version = "0.2.0rc5"
description = "让岗位来找你——本地优先、Agent 原生的职位发现与跟踪引擎，支持 ZCode/Codex/Claude Code 等 MCP 客户端"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "certifi>=2024.8.30",
  "pydantic>=2.10,<3",
  "pypdf>=5,<7",
]

[project.optional-dependencies]
browser = [
  "playwright>=1.50,<2",
  "requests>=2.32,<3",
  "websocket-client>=1.8,<2",
]
dev = [
  "pytest>=8,<10",
  "ruff>=0.12,<1",
]

[project.scripts]
jobfindsme = "jobfindsme.cli:main"

[project.urls]
Homepage = "https://github.com/russeell/jobfindsme"
Repository = "https://github.com/russeell/jobfindsme"
Issues = "https://github.com/russeell/jobfindsme/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jobfindsme = [
  "migrations/*.sql",
  "resources/**/*.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
