name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade build
      - name: Verify tag matches package version
        run: |
          package_version="$(python -c \
            'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "v${package_version}" = "${GITHUB_REF_NAME}"
      - run: python -m build --wheel
      - name: Generate SHA-256 checksum
        run: |
          wheel="$(find dist -name '*.whl' -print -quit)"
          wheel_name="$(basename "${wheel}")"
          (cd dist && sha256sum "${wheel_name}" > "${wheel_name}.sha256")
      # Ship the installer as a release asset too: the fixed URL
      # .../releases/latest/download/install.sh always points at the newest
      # script (no CDN cache lag), and install.sh downloads the same-version
      # wheel from the same release.
      - name: Stage installer as release asset
        run: cp scripts/install.sh dist/install.sh
      - name: Verify release wheel
        run: |
          wheel="$(find dist -name '*.whl' -print -quit)"
          python -m pip install "${wheel}[browser]"
      - run: python -m jobfindsme --version
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
      # PyPI publishing is intentionally deferred until the project is
      # mature; re-add a publish-pypi job (OIDC trusted publishing) then.
