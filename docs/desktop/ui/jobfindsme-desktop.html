const state={page:'discover',selected:1,pane:'detail',researchTab:'reputation',mobile:'list',filters:{...filterDefault},seen:new Set([2,4]),seenSnapshot:new Set([2,4]),saved:new Set([1]),applied:new Set(),limit:6,record:'saved',weightName:'均衡匹配',weights:[35,30,25,10],draftWeights:[35,30,25,10],sourceTab:'platforms',disabled:new Set(),login:new Set(),browserSource:'猎聘',browserMode:'job',sourceBrowser:false,resumeStage:0,fileLabel:'',privacy:'filter',privateFields:new Set(['name','phone','email','address']),resumeConfirmed:false,modelProvider:'OpenAI',modelName:'',modelBase:'',modelProtocol:'OpenAI 兼容',schedule:null,scheduleLog:[],taskEnabled:false};
const design={appearance:'跟随系统',density:'舒适',radius:9};
const selected=()=>jobs.find(j=>j.id===state.selected)||jobs[0];
const score=(j,w=state.weights)=>j.full?Math.round(j.parts.reduce((sum,p,i)=>sum+p*w[i]/100,0)):null;
const salary=j=>j.salary?`${j.salary[0]}–${j.salary[1]}K${j.months?' · '+j.months+' 薪':''}`:'薪资未披露';
const btn=(text,action,extra='')=>`<button type="button" class="btn ${extra}" data-action="${action}">${text}</button>`;
const resumeDraft={};
function selectHtml(id,label,options,value){return `<select id="${id}" aria-label="${label}">${options.map(v=>`<option value="${esc(v)}" ${value===v?'selected':''}>${esc(v)}</option>`).join('')}</select>`}
function notify(message){root.querySelector('#jf-status').textContent=message}
function icons(){if(globalThis.lucide)globalThis.lucide.createIcons({attrs:{width:15,height:15}})}
function persist(){window.openai?.setWidgetState?.({modelContent:{template:'desktop-v3',page:state.page,pane:state.pane,selectedCompany:selected().company,scoreTemplate:state.weightName},privateContent:{selected:state.selected,seen:[...state.seen],saved:[...state.saved],applied:[...state.applied],weights:state.weights,privacy:state.privacy}}).catch(()=>{})}
function restore(w){if(w?.modelContent?.template!=='desktop-v3')return;const p=w.privateContent||{},m=w.modelContent;if(names[m.page])state.page=m.page;if(['detail','research','browser'].includes(m.pane))state.pane=m.pane;if(jobs.some(j=>j.id===p.selected))state.selected=p.selected;['seen','saved','applied'].forEach(k=>{if(Array.isArray(p[k]))state[k]=new Set(p[k].filter(id=>jobs.some(j=>j.id===id)))});if(Array.isArray(p.weights)&&p.weights.length===4&&p.weights.every(x=>Number.isInteger(x)&&x>=0&&x<=100)&&p.weights.reduce((a,b)=>a+b,0)===100){state.weights=[...p.weights];state.draftWeights=[...p.weights];state.weightName=Object.hasOwn(templates,m.scoreTemplate)?m.scoreTemplate:'自定义'}if(['filter','keep'].includes(p.privacy))state.privacy=p.privacy;state.seenSnapshot=new Set(state.seen)}
function eligible(){const f=state.filters;return jobs.filter(j=>{if(state.disabled.has(j.source))return false;if(state.page==='records'&&!({saved:state.saved,seen:state.seen,applied:state.applied}[state.record]).has(j.id))return false;if(f.query&&!`${j.title} ${j.company} ${j.tags.join(' ')}`.toLowerCase().includes(f.query.toLowerCase()))return false;if(f.city!=='全部城市'&&f.city!==j.city)return false;if(f.source!=='全部来源'&&f.source!==j.source)return false;for(const [key,label]of[['track','不限通道'],['type','不限类型']])if(f[key]!==label&&(j[key]?j[key]!==f[key]:!f.unknown))return false;if(f.salary!=='不限薪资'&&(j.salary?j.salary[0]<parseInt(f.salary):!f.unknown))return false;if(state.page==='discover'&&f.view==='unseen'&&state.seenSnapshot.has(j.id)&&!(f.updates&&j.updated))return false;if(state.page==='discover'&&f.view==='seen'&&!state.seenSnapshot.has(j.id))return false;return true}).sort((a,b)=>(score(b)??-1)-(score(a)??-1)||a.id-b.id)}
function jobrow(j){return `<article class="job ${state.selected===j.id?'active':''}"><button class="jobopen" data-job="${j.id}" aria-pressed="${state.selected===j.id}"><span><strong>${j.title}</strong><span class="company">${j.company} · ${j.city} · ${j.exp}</span></span><span class="score">${score(j)??'—'}<small>${j.full?'匹配分':'待补 JD'}</small></span></button><div class="between"><p class="salary">${salary(j)}</p>${state.applied.has(j.id)?'<span class="pill">已投递</span>':state.seen.has(j.id)?`<span class="tiny mut">${j.updated?'已看 · 有更新':'已看过'}</span>`:''}</div><div class="jobmeta"><span>${j.track||'通道待确认'}</span><span>·</span><span>${j.type||'类型待确认'}</span><span>· ${j.source}</span></div><div class="jobactions"><button class="btn" data-research="${j.id}">${icon('scan-text')}研究岗位</button><button class="btn" data-apply="${j.id}">投递链接 ${icon('arrow-up-right')}</button></div></article>`}
function detail(j){return `<div class="panecontent"><div class="between"><span class="pill">${j.source} · 示例</span><button class="btn iconbtn" data-save="${j.id}" aria-label="${state.saved.has(j.id)?'取消收藏':'收藏岗位'}" aria-pressed="${state.saved.has(j.id)}">${icon(state.saved.has(j.id)?'bookmark-check':'bookmark')}</button></div><h2 style="margin-top:16px">${j.title}</h2><p class="sub">${j.company} / ${j.team}</p><p class="salary" style="font-size:18px">${salary(j)}</p><div class="facts"><div><span>工作地点</span>${j.city}</div><div><span>经验要求</span>${j.exp}</div><div><span>招聘通道</span>${j.track||'未披露'}</div><div><span>用工类型</span>${j.type||'未披露'}</div></div><hr><div class="between"><h3>${j.full?'为什么值得看看':'需要完整 JD'}</h3><span class="tiny mut">${j.full?score(j)+' / 100':'暂不评分'}</span></div><p class="copy">${j.full?`岗位涉及 ${j.tags.join('、')}，与示例简历有相关经历。匹配分用于比较岗位，不代表录用概率。`:'当前只有列表摘要，不足以判断技能与经验匹配。补充完整 JD 后再生成评分和准备建议。'}</p>${j.full?`<details><summary>评分依据 · ${esc(state.weightName)}</summary>${weightNames.map((n,i)=>`<div class="between tiny" style="margin-top:8px"><span>${n}</span><span>${(j.parts[i]*state.weights[i]/100).toFixed(1)} / ${state.weights[i]}</span></div>`).join('')}<p class="note">示例证据：JD 的 ${j.tags[0]} 要求，对应示例简历的项目实践。细项保留一位小数，总分四舍五入。</p><button class="btn ghost" data-page="scores">调整匹配规则 →</button></details>`:''}<div class="section"><h3>岗位职责 · 示例</h3><p class="copy">${j.full?`参与 ${j.tags[0]} 相关产品的设计、开发与评测；负责服务集成及故障定位，与产品团队协作完成交付。`:j.tags.join(' · ')}</p></div><div class="soft"><strong>投递前确认</strong><p>业务阶段、个人职责、团队节奏与薪资构成。口碑评价需核对部门及时间。</p></div><button class="btn ghost" data-viewed="${j.id}" style="margin-top:11px">${state.seen.has(j.id)?'标为未看过':'标为已看过'}</button></div><div class="paneactions"><button class="btn" data-research="${j.id}">研究岗位</button><button class="btn primary" data-apply="${j.id}">打开投递页 ${icon('arrow-up-right')}</button></div>`}
function researchBody(j){if(state.researchTab==='resume')return `<h3>针对 JD 修改简历</h3><p class="copy">以原始 JD 定位相关经历，基于真实事实逐段修改，不自动覆盖原版。</p>`;return `<h3>公开来源中的用户陈述</h3><p class="copy">调查对象：${esc(j.company)} · ${esc(j.title)}。JD 仅用于定位，不是员工口碑证据。</p><p>调查方向：岗位情况、工作强度、假期情况、员工关怀 / 体验。</p><p class="note">这是布局示例，未检索真实外部来源。公司、部门、岗位、职级、日期及适用范围缺失时显示未知；冲突陈述分别保留原文和原链接，失效链接明确标注。</p><p class="note">JobFindsMe 仅整理互联网上可公开访问的信息及原始来源，不对用户生成内容的真实性、完整性或代表性作保证；内容可能受岗位、部门、职级、地区及时间影响，请结合原始链接自行判断；JobFindsMe 不对公司或岗位作推荐、评级或好坏判断。</p><p class="note">信息有误 / 申请更正：正式版仅保存本地记录，未向外部提交。</p>`}
function researchPane(j){return `<div class="panecontent"><div class="between"><span class="tiny mut">${j.company} · 示例研究</span><button class="btn ghost" data-page="research">展开研究 ${icon('maximize-2')}</button></div><h2 style="margin-top:9px">${j.title}</h2><div class="tabs">${[['reputation','口碑调查'],['resume','针对 JD 修改简历']].map(([k,v])=>`<button data-research-tab="${k}" aria-pressed="${state.researchTab===k}">${v}</button>`).join('')}</div>${researchBody(j)}</div>`}
function browserPane(mode='job'){const j=selected(),src=mode==='login'?state.browserSource:j.source,logged=state.login.has(src);return `<div class="browserbar"><div class="row"><span class="address">${icon('lock-keyhole')} ${mode==='login'?esc(src)+' / 登录页':esc(src)+' / 岗位详情页'}</span><span class="pill">模拟浏览器</span></div></div><div class="webmock"><div class="webbrand between"><span>${esc(src)}</span><span class="tiny mut">${logged?'已登录 · 演示':'未登录 · 演示'}</span></div><div class="webbody">${mode==='login'?`<h2>在平台原页面登录</h2><p class="copy">正式版由你在此完成扫码或验证码登录，应用保留该平台的独立会话。</p><div class="soft">预览不加载真实平台，也不接收账号、密码或验证码。</div><button class="btn primary" data-login="${esc(src)}">${logged?'清除演示登录状态':'演示登录完成'}</button><p class="note">登录状态与检索可用性分别验证。</p>`:`<span class="pill">虚构岗位页面</span><h2 style="margin-top:15px">${j.title}</h2><p class="sub">${j.company} · ${j.city} · ${j.exp}</p><p class="salary">${salary(j)}</p><hr><h3>在招聘平台完成投递</h3><p class="copy">正式版这里展示原始岗位页面，你可直接上传简历、沟通并确认投递。</p><button class="btn" data-action="mocksubmit">预览平台投递操作</button><p class="note">此处只演示布局，没有真实提交按钮或真实岗位链接。</p>`}</div></div><div class="browserfoot">${mode==='job'?`<div class="between"><span class="tiny mut">打开页面 ≠ 投递成功</span><button class="btn ${state.applied.has(j.id)?'':'primary'}" data-confirmapply="${j.id}">${state.applied.has(j.id)?'已记录投递 · 可撤销':'我已完成投递'}</button></div>`:`<p class="note">正式版：登录失效时提示重新登录；兼容性未通过时提供外部浏览器入口。</p>`}</div>`}

function renderResults(){const rows=eligible();if(rows.length&&!rows.some(j=>j.id===state.selected))state.selected=rows[0].id;const mount=content.querySelector('#jf-results');mount.innerHTML=`<div class="between resultbar"><div class="row"><strong>${rows.length} 个示例岗位</strong><button class="btn ghost" data-page="scores" style="padding:0;font-size:11px">${esc(state.weightName)} ↓</button></div>${state.page==='discover'?`<div class="seg" aria-label="已看筛选">${[['all','全部'],['unseen','未看过'],['seen','已看过']].map(([k,v])=>`<button data-view="${k}" aria-pressed="${state.filters.view===k}">${v}</button>`).join('')}</div>`:''}</div>${state.filters.view==='unseen'&&state.page==='discover'?`<label class="check" style="margin-bottom:12px"><input type="checkbox" id="jf-updates" ${state.filters.updates?'checked':''}>保留已看但有更新的岗位</label>`:''}${rows.length?`<div class="seg mobile-switch" aria-label="窄屏工作区"><button data-mobile="list" aria-pressed="${state.mobile==='list'}">岗位列表 · ${rows.length}</button><button data-mobile="detail" aria-pressed="${state.mobile==='detail'}">所选岗位 / 投递</button></div><div class="workspace" data-mobile="${state.mobile}"><section class="listpane" aria-label="岗位列表">${rows.slice(0,state.limit).map(jobrow).join('')}<div class="load">${rows.length>state.limit?btn('加载更多 · 还有 '+(rows.length-state.limit)+' 个','more'):`已展示全部 ${rows.length} 个结果`}</div></section>${rightPane()}</div>`:`<div class="empty"><h3>${state.page==='records'?'这里还没有对应记录':'暂无符合条件的岗位'}</h3><p class="copy">可以调整筛选条件，或回到发现岗位继续浏览。</p>${btn('重置筛选','reset')}</div>`}`;icons()}
function discovery(){const f=state.filters;content.innerHTML=`<div class="between"><div><h1>${state.page==='records'?'求职记录':'发现岗位'}</h1><p class="sub">${state.page==='records'?'收藏、已看与已投递，各自清晰记录。':'找到合适的机会，在同一工作区研究与投递。'}</p></div><div class="row">${btn(icon('clock-3')+'保存为定时检索','schedule-current')}${btn(icon('plus')+'粘贴 JD','import')}</div></div>${state.page==='records'?`<div class="tabs">${[['saved','收藏'],['seen','已看过'],['applied','已投递']].map(([k,v])=>`<button data-record="${k}" aria-pressed="${state.record===k}">${v} · ${{saved:state.saved,seen:state.seen,applied:state.applied}[k].size}</button>`).join('')}</div>`:''}<form class="search" id="jf-search">${icon('search')}<input id="jf-query" aria-label="岗位、公司或技能" placeholder="岗位、公司或技能，例如 AI、Python" value="${esc(f.query)}"><button class="btn primary" type="submit">检索岗位 ${icon('arrow-right')}</button></form><div class="filters">${selectHtml('jf-city','城市',['全部城市','上海','北京','杭州','深圳'],f.city)}${selectHtml('jf-track','招聘通道',['不限通道','社招','校招'],f.track)}${selectHtml('jf-type','用工类型',['不限类型','全职','实习','兼职'],f.type)}${selectHtml('jf-salary','月薪下限',['不限薪资','20K 以上','25K 以上','30K 以上'],f.salary)}${selectHtml('jf-source','岗位来源',['全部来源',...platforms,'企业官网'],f.source)}<label class="check"><input id="jf-unknown" type="checkbox" ${f.unknown?'checked':''}>包含未披露条件</label></div><div class="between strip"><span>示例简历 · 薪资按月薪下限过滤 · 未知字段单独标识</span><button class="btn" data-page="sources">来源与账号 →</button></div><div id="jf-results"></div>`;renderResults()}
function researchPage(){content.innerHTML=`<div class="between"><div><h1>岗位研究</h1><p class="sub">${selected().company} · ${selected().title} · 示例报告</p></div><div class="row"><button class="btn" data-page="discover">${icon('arrow-left')}返回列表</button><button class="btn primary" data-apply="${state.selected}">打开投递页 →</button></div></div><div class="tabs">${[['reputation','口碑调查'],['resume','针对 JD 修改简历']].map(([k,v])=>`<button data-research-tab="${k}" aria-pressed="${state.researchTab===k}">${v}</button>`).join('')}</div><div class="settings">${researchBody(selected())}</div>`}

r'?`<div class="row section">${[['name','姓名'],['phone','电话'],['email','邮箱'],['address','详细地址']].map(([k,v])=>`<label class="check"><input type="checkbox" data-private="${k}" ${state.privateFields.has(k)?'checked':''}>${v}</label>`).join('')}</div>`:'<p class="note">分析副本将保留个人信息；真实发送前应展示接收模型和完整预览。</p>'}<hr><h3>分析副本预览 · 示例</h3><pre class="previewtext" id="jf-private-preview">${esc(privacyText())}</pre><div class="soft"><strong>不改变投递文件</strong><p>脱敏只影响分析副本。投递时由你选择原始简历或其他版本。</p></div><p class="note">本模板不会存储简历内容或发送给模型。</p></aside></div>`}
function draftTotal(){return state.draftWeights.reduce((a,b)=>a+b,0)}
function scores(){content.innerHTML=`<div class="between"><div><h1>匹配规则</h1><p class="sub">先满足硬条件，再用你认可的规则排列机会。</p></div><span class="pill">当前应用：${esc(state.weightName)}</span></div><div class="settingssplit section"><section class="panel"><label class="field">从模板开始${selectHtml('jf-template','评分模板',[...Object.keys(templates),'自定义'],state.weightName)}</label><div class="weights">${weightNames.map((n,i)=>`<label class="weight"><span>${n}<small>${['与期望职责的相关性','JD 必需技能的证据','相关项目与个人贡献','明确的非必需加分条件'][i]}</small></span><input type="number" min="0" max="100" step="1" data-weight="${i}" aria-label="${n}权重" value="${state.draftWeights[i]}"></label>`).join('')}</div><div class="between section"><span class="tiny">权重合计 <strong id="jf-total">${draftTotal()}%</strong></span>${btn('应用规则并重新排序','weights-save','primary')}</div><p class="error" role="alert" id="jf-weight-error"></p><p class="note">合计需为 100%。编辑时右侧实时预览，点击应用后更新岗位排序。</p></section><aside class="panel"><h3>排序预览</h3><p class="note">同一组虚构证据，比较不同权重的结果。</p><div id="jf-rank"></div><hr><h3>评分边界</h3><p class="copy">硬过滤不参与加权。完整 JD 缺失的岗位暂不评分；总分与证据完整度分别展示。</p><p class="copy">年龄、性别、姓名等身份信息不进入匹配规则。评分不代表录用概率。</p></aside></div>`;rankPreview()}
function rankPreview(){const mount=content.querySelector('#jf-rank');if(!mount)return;const total=draftTotal();mount.innerHTML=total===100?jobs.filter(j=>j.full).sort((a,b)=>score(b,state.draftWeights)-score(a,state.draftWeights)||a.id-b.id).slice(0,5).map((j,i)=>`<div class="rankrow"><span><span class="mut">0${i+1}</span>　${j.company}<br><span class="tiny mut">${j.title}</span></span><strong>${score(j,state.draftWeights)}</strong></div>`).join(''):'<p class="copy">将权重合计调整为 100% 后显示预览。</p>';content.querySelector('#jf-total').textContent=total+'%'}
function sourceCard(name){return `<article class="sourceitem"><div class="between"><h3>${name}</h3><label class="check"><input type="checkbox" data-source="${name}" ${state.disabled.has(name)?'':'checked'}>启用</label></div><div class="facts"><div><span>登录会话</span>${state.login.has(name)?'已登录 · 演示':'未登录'}</div><div><span>检索能力</span>${name==='猎聘'?'列表曾单次验证':'待验证'}</div></div><p class="note">${name==='猎聘'?'标题 / 城市 / 薪资已有样本；完整 JD、通道、分页待验收。':'列表、详情、字段与分页需要分别验收。'}</p><div class="row section"><button class="btn" data-openlogin="${name}">${state.login.has(name)?'管理登录会话':'在右侧登录'} ${icon('arrow-up-right')}</button><button class="btn ghost" data-probe="${name}">查看验证项</button></div></article>`}
function sources(){content.innerHTML=`<div class="between"><div><h1>来源与账号</h1><p class="sub">平台会话与数据能力，分别查看和维护。</p></div><span class="pill">当前为连接演示</span></div><div class="tabs"><button data-source-tab="platforms" aria-pressed="${state.sourceTab==='platforms'}">招聘平台 · 4</button><button data-source-tab="companies" aria-pressed="${state.sourceTab==='companies'}">公司官网 · 11</button></div>${state.sourceTab==='platforms'?`<div class="${state.sourceBrowser?'settingssplit':'sourcegrid'}"><section class="${state.sourceBrowser?'':'full'}">${state.sourceBrowser?sourceCard(state.browserSource):`<div class="sourcegrid">${platforms.map(sourceCard).join('')}</div>`}</section>${state.sourceBrowser?`<aside class="rightpane"><div class="panetop"><strong class="tiny">${esc(state.browserSource)} · 登录窗口</strong>${btn('关闭','source-browser-close','ghost')}</div>${browserPane('login')}</aside>`:''}</div>`:`<div class="tablewrap"><table><thead><tr><th>公司</th><th>校招 / 社招</th><th>完整 JD / 分页</th><th>状态</th></tr></thead><tbody>${companies.map(n=>`<tr><td>${n}</td><td>分入口验收</td><td>待验证</td><td>${['百度','京东'].includes(n)?'有公开页面样本':'待验证'}</td></tr>`).join('')}</tbody></table></div>`}<div class="soft"><strong>连接状态不等于来源可用</strong><p>正式版分别记录登录、列表、完整 JD、字段覆盖、分页、更新时间。失败时显示失败与缓存时间，不显示为“没有岗位”。</p></div>`}
function filterSummary(f){return [f.query||'全部关键词',f.city,f.track,f.type,f.salary,f.source,f.unknown?'允许未知字段':'严格已知字段',f.view==='unseen'?'未看过':f.view==='seen'?'已看过':'全部已看状态',f.updates?'保留岗位更新':'不保留已看更新'].join(' · ')}
function schedule(){const s=state.schedule;content.innerHTML=`<div class="between"><div><h1>定时检索</h1><p class="sub">保存条件，定期发现新增或有变化的机会。</p></div><span class="pill">仅演示配置 · 未运行调度器</span></div>${s?`<article class="taskcard"><div class="between"><div><h3>${esc(s.name)}</h3><p class="note">${esc(s.frequency)} ${esc(s.time)} · Asia/Shanghai · ${state.taskEnabled?'已启用（演示）':'已暂停（演示）'}</p></div><div class="row">${btn(state.taskEnabled?'暂停':'启用','task-toggle')}${btn('模拟一次结果','task-run')}</div></div><p class="copy">${esc(filterSummary(s.filters))}</p><p class="note">规则快照：${esc(s.rule)} · 权重 ${s.weights.join('/')} · 示例简历 v1</p><p class="note">错过执行：${esc(s.missed)} · 通知：${esc(s.notify)}</p></article>`:''}<div class="settingssplit section"><section class="panel"><h3>${s?'编辑检索任务':'创建检索任务'}</h3><form id="jf-task-form"><div class="formgrid"><label class="field full">任务名称<input id="jf-task-name" required maxlength="60" value="${esc(s?.name||'我的岗位雷达')}"></label><label class="field">执行频率${selectHtml('jf-task-frequency','执行频率',['每天','工作日','每周一'],s?.frequency||'工作日')}</label><label class="field">执行时间<input type="time" id="jf-task-time" required value="${esc(s?.time||'09:00')}"></label><label class="field full">错过执行时${selectHtml('jf-task-missed','错过执行',['下次启动补跑一次','跳过本次'],s?.missed||'下次启动补跑一次')}</label><label class="field full">通知策略${selectHtml('jf-task-notify','通知策略',['仅新增、重要更新及失败','仅新增岗位','仅在应用内记录'],s?.notify||'仅新增、重要更新及失败')}</label></div><div class="soft"><strong>本次保存的检索条件</strong><p>${esc(filterSummary(state.filters))}</p><p>评分：${esc(state.weightName)} · 示例简历 v1</p></div><button class="btn primary" type="submit" style="margin-top:17px">保存演示任务</button><p class="note">保存当前条件的快照；之后修改筛选不会自动改变任务。</p></form></section><aside class="panel"><h3>执行记录</h3>${state.scheduleLog.length?state.scheduleLog.map(x=>`<div class="rankrow"><span>${esc(x)}</span><span class="pill">模拟</span></div>`).join(''):'<p class="copy">暂无执行记录。</p>'}<hr><h3>本地运行条件</h3><p class="copy">正式版需要电脑运行且后台服务可用。关机或休眠期间不能保证执行；恢复后按你的补跑设置处理。</p><p class="copy">登录过期会标为“需要登录”。来源失败与“零新增”分别记录。</p><p class="note">本次预览不会创建系统任务或发送通知。</p></aside></div>`}
function models(){content.innerHTML=`<h1>模型设置</h1><p class="sub">选择用于岗位匹配与简历改写的服务。</p><div class="settings"><form id="jf-model-form"><div class="formgrid"><label class="field">服务商${selectHtml('jf-provider','服务商',['OpenAI','DeepSeek','阿里百炼 / 千问','智谱','Kimi','Anthropic Claude','Google Gemini','本地 / 自定义'],state.modelProvider)}</label><label class="field">接口协议${selectHtml('jf-protocol','接口协议',['OpenAI 兼容','Anthropic 原生','Gemini 原生'],state.modelProtocol)}</label><label class="field full">API 地址<input id="jf-base" type="url" placeholder="https://api.example.com/v1" value="${esc(state.modelBase)}"></label><label class="field full">模型名称<input id="jf-model" placeholder="填写服务商提供的模型 ID" value="${esc(state.modelName)}"></label><label class="field full">API Key<input type="password" disabled placeholder="原型不接收真实密钥"><span class="note">正式版由本地安全存储管理，界面仅显示掩码。</span></label></div><div class="row section"><button class="btn primary" type="submit">保存演示配置</button>${btn('测试连接','model-test')}</div></form><div class="soft"><strong>发送前检查简历分析副本</strong><p>遵循“我的简历”中的个人信息设置。当前没有发起模型请求。</p></div><p class="copy">基础检索、条件过滤和岗位记录不依赖模型。配置模型不会自动获得招聘平台或社区数据访问能力。</p></div>`}
function render(){notify('');root.querySelectorAll('.sidebar [data-page]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.page===state.page)));root.querySelector('#jf-crumb').textContent='工作空间 / '+names[state.page];root.querySelector('#jf-count').textContent=state.saved.size||'';if(['discover','records'].includes(state.page))discovery();else if(state.page==='research')researchPage();else if(state.page==='resume')resume();else if(state.page==='scores')scores();else if(state.page==='sources')sources();else if(state.page==='schedule')schedule();else models();for(const form of content.querySelectorAll('form')){const submit=form.querySelector('button[type="submit"]');if(submit){submit.type='button';submit.onclick=()=>handleForm(form)}form.onkeydown=e=>{if(e.key==='Enter'&&e.target.tagName!=='TEXTAREA'){e.preventDefault();handleForm(form)}}}for(const [id,value]of Object.entries(resumeDraft)){const field=content.querySelector('#'+id);if(field)field.value=value}icons()}
let priorFocus=null;
function modal(title,body){priorFocus=document.activeElement;root.querySelector('#jf-modal-title').textContent=title;root.querySelector('#jf-modal-body').innerHTML=body;root.querySelector('#jf-modal').hidden=false;root.querySelector('#jf-app').inert=true;root.querySelector('[data-action=close]').focus();icons()}
function close(){root.querySelector('#jf-modal').hidden=true;root.querySelector('#jf-app').inert=false;if(priorFocus?.isConnected)priorFocus.focus()}
function openJob(id,pane){state.selected=Number(id);state.seen.add(state.selected);state.mobile='detail';state.pane=pane;if(!['discover','records'].includes(state.page)){state.page='discover';state.filters={...filterDefault};state.limit=12;render()}else renderResults();persist()}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||!root.contains(b))return;const d=b.dataset;
 if(d.page){state.page=d.page;state.seenSnapshot=new Set(state.seen);state.sourceBrowser=false;state.mobile='list';if(d.page==='scores')state.draftWeights=[...state.weights];render();persist();return}
 if(d.job){openJob(d.job,'detail');return}if(d.research){state.researchTab='prep';openJob(d.research,'research');return}if(d.apply){openJob(d.apply,'browser');return}
 if(d.save){const id=Number(d.save);state.saved.has(id)?state.saved.delete(id):state.saved.add(id);render();persist();return}
 if(d.viewed){const id=Number(d.viewed);state.seen.has(id)?state.seen.delete(id):state.seen.add(id);renderResults();persist();return}
 if(d.view){state.filters.view=d.view;state.seenSnapshot=new Set(state.seen);state.mobile='list';state.limit=6;renderResults();persist();return}
 if(d.mobile){state.mobile=d.mobile;if(d.mobile==='detail')state.seen.add(state.selected);renderResults();persist();return}
 if(d.pane){state.pane=d.pane;state.seen.add(state.selected);renderResults();persist();return}
 if(d.researchTab){state.researchTab=d.researchTab;state.page==='research'?render():renderResults();persist();return}
 if(d.record){state.record=d.record;state.mobile='list';render();persist();return}
 if(d.privacy){state.privacy=d.privacy;render();persist();return}
 if(d.sourceTab){state.sourceTab=d.sourceTab;state.sourceBrowser=false;render();return}
 if(d.openlogin){state.browserSource=d.openlogin;state.sourceBrowser=true;render();return}
 if(d.login){state.login.has(d.login)?state.login.delete(d.login):state.login.add(d.login);render();notify('仅修改演示登录状态；未连接真实平台。');return}
 if(d.probe){modal(d.probe+' · 接入验收',`<p class="copy">登录与数据读取分别验收，当前尚未完成稳定性验证。</p><div class="facts">${['登录保持','列表字段覆盖','完整 JD','分页与去重','校招 / 社招字段','更新时间与失败恢复'].map(x=>`<div><span>${x}</span>待验证</div>`).join('')}</div><p class="note">不在本预览中启动检测或登录。</p>`);return}
 if(d.confirmapply){const id=Number(d.confirmapply);if(state.applied.has(id)){state.applied.delete(id);renderResults();persist()}else modal('记录已完成投递',`<p class="copy">将“${esc(selected().company)} · ${esc(selected().title)}”记入已投递。本操作只更新求职记录，不向招聘平台提交资料。</p><button class="btn primary" data-recordapply="${id}" style="margin-top:20px">确认记录</button>`);return}
 if(d.recordapply){state.applied.add(Number(d.recordapply));close();renderResults();persist();notify('已记录为已投递（示例）；没有发生真实投递。');return}
 if(d.evidence){modal('原帖索引 · 示例 '+d.evidence,'<p class="copy">正式版会保存平台、原始链接、发布时间、抓取时间及适用团队。本条为虚构证据，没有可打开的真实帖子。</p>');return}
 const a=d.action;if(a==='close'){close();return}if(a==='more'){state.limit+=6;renderResults();return}if(a==='reset'){state.filters={...filterDefault};state.mobile='list';state.seenSnapshot=new Set(state.seen);render();return}
 if(a==='schedule-current'){state.page='schedule';render();return}
 if(a==='source-browser-close'){state.sourceBrowser=false;render();return}
 if(a==='resume-demo'){state.resumeStage=1;state.resumeConfirmed=false;render();return}
 if(a==='resume-confirm'){state.resumeStage=2;state.resumeConfirmed=true;render();notify('示例解析核对完成；修改只保留在本次页面会话，未用于匹配。');return}
 if(a==='weights-save'){if(draftTotal()!==100||state.draftWeights.some(x=>!Number.isInteger(x)||x<0||x>100)){content.querySelector('#jf-weight-error').textContent='每项为 0–100 的整数，权重合计必须为 100%。';return}state.weights=[...state.draftWeights];state.weightName=Object.keys(templates).find(k=>templates[k].every((n,i)=>n===state.weights[i]))||'自定义';render();notify('规则已应用，岗位列表将使用新的匹配排序。');persist();return}
 if(a==='task-toggle'){state.taskEnabled=!state.taskEnabled;render();return}
 if(a==='task-run'){state.scheduleLog.unshift('演示运行：2 个新增、1 个重要更新');state.scheduleLog=state.scheduleLog.slice(0,4);render();notify('仅展示一次执行结果；没有检索、创建任务或发送通知。');return}
 if(a==='mocksubmit'){modal('平台投递操作预览','<p class="copy">正式版将在右侧加载平台原页面，由你自行完成投递。当前岗位与页面均为虚构，未提交任何内容。</p>');return}
 if(a==='model-test'){notify('原型未发起网络请求。正式版需保存有效密钥后测试服务连接。');return}
 if(a==='import'){modal('从完整 JD 开始',`<label class="field section">岗位描述<textarea id="jf-jd" placeholder="粘贴岗位职责与任职要求"></textarea></label><p class="note">本预览不分析输入内容，下一步展示独立的虚构报告。</p><p class="error" id="jf-jd-error" role="alert"></p>${btn('查看示例研究','import-go','primary')}`);return}
 if(a==='import-go'){if(!root.querySelector('#jf-jd').value.trim()){root.querySelector('#jf-jd-error').textContent='请先填写 JD。';return}close();state.selected=1;state.page='research';state.researchTab='prep';render();notify('展示知序科技的虚构报告；未分析或保存输入的 JD。')}
});
root.addEventListener('change',e=>{const t=e.target,id=t.id;
 for(const k of ['city','track','type','salary','source'])if(id==='jf-'+k){state.filters[k]=t.value;state.limit=6;state.mobile='list';state.seenSnapshot=new Set(state.seen);renderResults();return}
 if(id==='jf-unknown'||id==='jf-updates'){state.filters[id==='jf-unknown'?'unknown':'updates']=t.checked;state.seenSnapshot=new Set(state.seen);renderResults();return}
 if(t.dataset.private){t.checked?state.privateFields.add(t.dataset.private):state.privateFields.delete(t.dataset.private);content.querySelector('#jf-private-preview').textContent=privacyText();return}
 if(t.dataset.source){t.checked?state.disabled.delete(t.dataset.source):state.disabled.add(t.dataset.source);notify('来源选择仅作用于示例岗位；没有修改真实连接。');return}
 if(id==='jf-file'){const f=t.files?.[0];if(!f)return;if(!/\.(pdf|docx?|md|markdown|txt)$/i.test(f.name)){notify('请选择 PDF、Word、Markdown 或 TXT 文件。');return}state.fileLabel=f.name+' · '+Math.max(1,Math.round(f.size/1024))+' KB · 已选择，真实解析待接入';render();return}
 if(id==='jf-template'){state.draftWeights=[...(templates[t.value]||state.weights)];content.querySelectorAll('[data-weight]').forEach((el,i)=>el.value=state.draftWeights[i]);rankPreview();return}
 if(id==='jf-provider'){state.modelProvider=t.value;state.modelProtocol=t.value==='Anthropic Claude'?'Anthropic 原生':t.value==='Google Gemini'?'Gemini 原生':'OpenAI 兼容';content.querySelector('#jf-protocol').value=state.modelProtocol;return}
});
root.addEventListener('input',e=>{if(['jf-role','jf-years','jf-skills','jf-project'].includes(e.target.id))resumeDraft[e.target.id]=e.target.value;if(e.target.dataset.weight!==undefined){state.draftWeights[Number(e.target.dataset.weight)]=Number(e.target.value);rankPreview();content.querySelector('#jf-weight-error').textContent=''}});
function handleForm(form){if(!form.reportValidity())return;if(form.id==='jf-search'){state.filters.query=content.querySelector('#jf-query').value.trim();state.mobile='list';state.limit=6;state.seenSnapshot=new Set(state.seen);renderResults();notify('已筛选本地示例岗位，未发起真实检索。')}
 if(form.id==='jf-task-form'){const name=content.querySelector('#jf-task-name').value.trim();if(!name){notify('请填写任务名称。');return}state.schedule={name,frequency:content.querySelector('#jf-task-frequency').value,time:content.querySelector('#jf-task-time').value,missed:content.querySelector('#jf-task-missed').value,notify:content.querySelector('#jf-task-notify').value,filters:{...state.filters},weights:[...state.weights],rule:state.weightName};state.taskEnabled=true;render();notify('演示配置已保留在本次会话中；未创建真实定时任务。')}
 if(form.id==='jf-model-form'){state.modelBase=content.querySelector('#jf-base').value;state.modelName=content.querySelector('#jf-model').value;state.modelProtocol=content.querySelector('#jf-protocol').value;notify('已保留本次会话的演示配置，未存储密钥或连接服务。')}
}
root.addEventListener('submit',e=>{e.preventDefault();handleForm(e.target)});
root.addEventListener('keydown',e=>{const m=root.querySelector('#jf-modal');if(m.hidden)return;if(e.key==='Escape'){close();return}if(e.key==='Tab'){const all=[...m.querySelectorAll('button,input,textarea,select')].filter(x=>!x.disabled&&!x.hidden),first=all[0],last=all.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
function applyDesign(){root.style.colorScheme=design.appearance==='浅色'?'light':design.appearance==='深色'?'dark':'inherit';root.style.setProperty('--space',design.density==='紧凑'?'12px':'17px');root.style.setProperty('--radius',design.radius+'px')}
restore(window.openai?.widgetState);render();window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState?.modelContent?.template==='desktop-v3'){restore(e.detail.globals.widgetState);render()}});
if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:applyDesign});tweak.addSelect(design,'appearance',{label:'外观',options:['跟随系统','浅色','深色']});tweak.addSelect(design,'density',{label:'岗位列表密度',options:['舒适','紧凑']});tweak.addSlider(design,'radius',{label:'面板圆角',min:4,max:14,unit:'px'})}
})();
