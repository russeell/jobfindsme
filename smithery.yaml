# Smithery configuration for jobfindsme
# https://smithery.ai/docs/config#smitheryyaml

startCommand:
  type: stdio
  configSchema:
    type: object
    required: []
    properties:
      debug:
        type: boolean
        default: false
        description: Enable debug logging (stderr)
  commandFunction:
    |-
    (config) => ({
      command: 'python',
      args: ['-m', 'jobfindsme', 'mcp'],
      env: config.debug ? { JOBFINDSME_DEBUG: '1' } : {}
    })
  exampleConfig:
    debug: false
