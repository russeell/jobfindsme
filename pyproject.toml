[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-job-search"
version = "0.13.0"
description = "Local-first desktop app for finding and researching jobs"
readme = "README.md"
license = "PolyForm-Noncommercial-1.0.0"
keywords = ["ai", "job-search", "recruitment", "desktop", "career", "resume", "china-jobs",
            "求职", "招聘", "AI求职", "BOSS直聘", "猎聘"]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Office/Business",
]
dependencies = [
  "certifi>=2024.8.30",
  "fastapi>=0.116,<0.120",
  "pydantic>=2.10,<3",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "reportlab>=4.2,<5",
  "uvicorn>=0.35,<1",
  "tzdata>=2025.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
browser = [
  "requests>=2.32,<3",
  "websocket-client>=1.8,<2",
  "curl_cffi>=0.7,<1",
]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<10",
  "ruff>=0.12,<1",
]

[project.urls]
Homepage = "https://github.com/russeell/jobfindsme"
Repository = "https://github.com/russeell/jobfindsme"
Issues = "https://github.com/russeell/jobfindsme/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jobfindsme = [
  "migrations/*.sql",
  "resources/**/*.md",
  "resources/**/*.json",
  "resources/**/*.js",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
pythonpath = [".", "src"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
]
