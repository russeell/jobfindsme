name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-ubuntu:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libcurl4-openssl-dev fonts-wqy-microhei
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - name: Synthetic evaluation regression gate
        run: >-
          python -m evaluation.cli
          --dataset evaluation/data/v0.1.json
          --report ${{ runner.temp }}/synthetic-evaluation.json
          --type synthetic
      - name: Golden matching regression gate
        run: >-
          python -m evaluation.cli
          --dataset evaluation/data/golden/golden_v1.json
          --report ${{ runner.temp }}/golden-evaluation.json
          --type golden
      - run: ruff check .
      - run: ruff format --check .

  test-desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  test-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - run: ruff check .
      - run: ruff format --check .

  test-windows:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Windows browser and desktop API regressions
        run: >-
          python -m pytest
          tests/connectors/test_boss_zhipin.py
          tests/desktop_api
      - name: Build and install the Windows wheel
        shell: pwsh
        run: |
          python -m pip install build
          python -m build --wheel
          $wheel = Get-ChildItem dist -Filter *.whl | Select-Object -First 1
          python -m pip install --force-reinstall --no-deps $wheel.FullName
          python -c "import jobfindsme.desktop_api; print('Desktop API package installed')"
      - run: ruff check .
      - run: ruff format --check .
