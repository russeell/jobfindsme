name: macOS desktop package
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements/release.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Verify Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - name: Install hashed release dependencies
        run: python -m pip install --require-hashes -r requirements/release.txt
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python -m pytest
      - name: Cache upstream Electron archive
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/electron-cache
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/desktop/package-lock.json') }}
      - run: npm ci
        env:
          ELECTRON_CACHE: ${{ runner.temp }}/electron-cache
        working-directory: apps/desktop
      - run: node node_modules/electron/install.js
        env:
          ELECTRON_CACHE: ${{ runner.temp }}/electron-cache
        working-directory: apps/desktop
      - run: npm run build
        working-directory: apps/desktop
      - run: npm test
        working-directory: apps/desktop
      - run: python scripts/freeze_desktop_api.py
      - run: node scripts/package-macos.mjs
        working-directory: apps/desktop
      - run: node scripts/audit-macos-package.mjs
        working-directory: apps/desktop
      - run: node scripts/smoke-desktop.mjs
        working-directory: apps/desktop
      - name: Archive tested application
        working-directory: apps/desktop/release/mac-unpacked
        run: |
          ditto -c -k --sequesterRsrc --keepParent JobFindsMe.app mac-arm64.zip
          shasum -a 256 mac-arm64.zip > SHA256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: JobFindsMe-mac-arm64
          path: |
            apps/desktop/release/mac-unpacked/*.zip
            apps/desktop/release/mac-unpacked/*.txt
            apps/desktop/release/mac-unpacked/*.png
