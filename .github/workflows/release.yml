name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write  # needed for PyPI trusted publishing

jobs:
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade build
      - name: Verify tag matches package version
        run: |
          package_version="$(python -c \
            'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "v${package_version}" = "${GITHUB_REF_NAME}"
      - run: python -m build --wheel
      - name: Verify release wheel
        run: |
          wheel="$(find dist -name '*.whl' -print -quit)"
          python -m pip install "${wheel}[browser]"
      - run: python -m jobfindsme --version
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl
          generate_release_notes: true
      - name: Store wheel for PyPI publish
        uses: actions/upload-artifact@v4
        with:
          name: release-wheel
          path: dist/*.whl

  publish-pypi:
    needs: wheel
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/jobfindsme
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-wheel
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
