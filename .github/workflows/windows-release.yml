name: Windows desktop package
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements/release.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install hashed release dependencies
        run: python -m pip install --require-hashes -r requirements/release.txt
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python -m pytest
      - name: Cache upstream Electron archive
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/electron-cache
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/desktop/package-lock.json') }}
      - run: npm ci
        env:
          ELECTRON_CACHE: ${{ runner.temp }}/electron-cache
        working-directory: apps/desktop
      - name: Install Electron binary explicitly
        run: node node_modules/electron/install.js
        env:
          ELECTRON_CACHE: ${{ runner.temp }}/electron-cache
        working-directory: apps/desktop
      - run: npm run build
        working-directory: apps/desktop
      - run: npm test
        working-directory: apps/desktop
      - run: python scripts/freeze_desktop_api.py
      - run: node scripts/package-windows.mjs
        working-directory: apps/desktop
      - run: node scripts/audit-windows-package.mjs
        working-directory: apps/desktop
      - run: node scripts/smoke-desktop.mjs
        working-directory: apps/desktop
      - shell: pwsh
        run: |
          Compress-Archive -Path apps/desktop/release/windows/JobFindsMe -DestinationPath apps/desktop/release/windows/JobFindsMe-windows-x64.zip
          Get-FileHash apps/desktop/release/windows/JobFindsMe-windows-x64.zip -Algorithm SHA256 | Format-List | Out-File apps/desktop/release/windows/SHA256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: JobFindsMe-windows-x64
          path: |
            apps/desktop/release/windows/*.zip
            apps/desktop/release/windows/*.txt
            apps/desktop/release/windows/*.png
