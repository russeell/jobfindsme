[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "jobfindsme"
version = "0.6.0"
description = "AI求职雷达 | 聚合BOSS直聘和猎聘 | 硬条件过滤 | 可解释推荐 | 增量岗位追踪"
readme = "README.md"
license = "MIT"
keywords = ["ai", "job-search", "recruitment", "mcp", "career", "resume", "china-jobs",
            "求职", "招聘", "AI求职", "BOSS直聘", "猎聘"]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Office/Business",
]
dependencies = [
  "certifi>=2024.8.30",
  "pydantic>=2.10,<3",
  "pypdf>=5,<7",
]

[project.optional-dependencies]
browser = [
  "requests>=2.32,<3",
  "websocket-client>=1.8,<2",
  "curl_cffi>=0.7,<1",
]
dev = [
  "pytest>=8,<10",
  "ruff>=0.12,<1",
]

[project.scripts]
jobfindsme = "jobfindsme.cli:main"

[project.urls]
Homepage = "https://github.com/russeell/jobfindsme"
Repository = "https://github.com/russeell/jobfindsme"
Issues = "https://github.com/russeell/jobfindsme/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jobfindsme = [
  "migrations/*.sql",
  "resources/**/*.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
