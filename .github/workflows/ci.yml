name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-ubuntu:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libcurl4-openssl-dev
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - name: Synthetic evaluation regression gate
        run: >-
          python -m evaluation.cli
          --dataset evaluation/data/v0.1.json
          --report ${{ runner.temp }}/synthetic-evaluation.json
          --type synthetic
      - run: ruff check .
      - run: ruff format --check .
      - run: bash scripts/smoke_installed_package.sh

  test-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - run: ruff check .
      - run: ruff format --check .

  clean-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: bash scripts/smoke_fast_install.sh

  agent-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Canonical Skill is synchronized into the wheel package
        run: python scripts/sync_skill.py --check
      - name: No-Skill baseline must fail
        run: >-
          python -m evaluation.agent_behavior.cli
          --cases evaluation/agent_behavior/data/cases.json
          --transcripts evaluation/agent_behavior/data/fixtures/baseline.json
          --report ${{ runner.temp }}/agent-baseline.json
          --expect fail
          --require-evidence contract_fixture
      - name: Skill contract must pass
        run: >-
          python -m evaluation.agent_behavior.cli
          --cases evaluation/agent_behavior/data/cases.json
          --transcripts evaluation/agent_behavior/data/fixtures/with_skill.json
          --report ${{ runner.temp }}/agent-with-skill.json
          --expect pass
          --require-evidence contract_fixture
